<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1c1a17">
<title>三国模拟人生</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div id="app">

  <header>

    <h1>三国模拟人生</h1>

    <div id="toolbar">

      <button
        id="themeBtn"
        type="button"
      >
        日间模式
      </button>

      <button
        id="newGameBtn"
        type="button"
      >
        新开一局
      </button>

      <button
        id="settingsBtn"
        type="button"
      >
        设置
      </button>

    </div>

  </header>

  <!-- 角色状态条：体力 / 伤势 / 年龄 / 回合 / 难度 -->
  <div id="statusBar" class="hidden"></div>

  <main id="chatWindow"></main>

  <div id="inputArea">

    <textarea
      id="userInput"
      rows="1"
      placeholder="输入你的行动或对话，留空直接发送可让剧情自动推进"
      autocomplete="off"
      spellcheck="false"
    ></textarea>

    <button
      id="sendBtn"
      type="button"
    >
      发送
    </button>

  </div>

</div>


<!-- =========================================================
     API Key 弹窗
     ========================================================= -->

<div id="keyModal" class="hidden">

  <div class="modal-card">

    <div class="modal-header">

      <h2 id="keyModalTitle">
        填写你的 DeepSeek API Key
      </h2>

      <button
        id="keyCloseBtn"
        class="modal-close-btn"
        type="button"
      >
        ✕
      </button>

    </div>

    <p>
      Key 只保存在你的浏览器里，不会上传到服务器。
    </p>

    <input
      type="password"
      id="keyInput"
      placeholder="sk-xxxxxxxxxxxxxxxx"
      autocomplete="off"
      spellcheck="false"
    >

    <p
      id="keyError"
      class="key-error"
    ></p>

    <button
      id="keySubmitBtn"
      type="button"
    >
      开始游戏
    </button>

    <button
      id="keyClearBtn"
      type="button"
      class="key-clear-btn"
    >
      清除 Key
    </button>

  </div>

</div>


<!-- =========================================================
     设置面板
     ========================================================= -->

<div id="settingsModal" class="hidden">

  <div class="modal-card">

    <div class="modal-header">

      <h2>设置</h2>

      <button
        id="settingsCloseBtn"
        class="modal-close-btn"
        type="button"
      >
        ✕
      </button>

    </div>

    <div class="settings-row">

      <span class="settings-label">
        AI 模型
      </span>

      <select
        id="modelSelect"
        title="选择 AI 模型"
      >
        <option value="deepseek-flash">
          Flash
        </option>

        <option value="deepseek-v4-pro">
          Pro
        </option>
      </select>

    </div>

    <div class="settings-row">

      <span class="settings-label">
        难度
      </span>

      <select
        id="difficultySelect"
        title="选择难度：决定死亡的阈值与频率"
      >
        <option value="history">史实（会死，但不轻易死）</option>
        <option value="ironman">铁人（死亡即锁档）</option>
        <option value="storybook">沙盒（明示才会死）</option>
      </select>

    </div>

    <div class="settings-section-label">
      存档管理
    </div>

    <div
      id="slotList"
      class="slot-list"
    ></div>

    <button
      id="exportBtn"
      type="button"
      class="settings-action-btn"
    >
      导出当前存档
    </button>

    <textarea
      id="importArea"
      class="import-area"
      rows="3"
      placeholder="粘贴存档 JSON，点下方按钮导入……"
    ></textarea>

    <button
      id="importBtn"
      type="button"
      class="settings-action-btn"
    >
      导入到空槽位
    </button>

    <button
      id="changeKeyBtn"
      type="button"
      class="settings-action-btn"
    >
      更换 API Key
    </button>

  </div>

</div>


<!-- =========================================================
     终局面板
     ========================================================= -->

<div id="endingModal" class="hidden">

  <div class="modal-card ending-card">

    <div class="modal-header">

      <h2 id="endingName">这一生</h2>

      <button
        id="endingCloseBtn"
        class="modal-close-btn"
        type="button"
      >
        ✕
      </button>

    </div>

    <div class="ending-body">

      <div class="ending-row">
        <span class="ending-label">死因</span>
        <span id="endingCause"></span>
      </div>

      <div class="ending-row">
        <span class="ending-label">生卒</span>
        <span id="endingYears"></span>
      </div>

      <div class="ending-epitaph">
        <span class="ending-label">墓志铭</span>
        <p id="endingEpitaph"></p>
      </div>

    </div>

    <div class="ending-actions">

      <button
        id="endingLegacyBtn"
        type="button"
        class="settings-action-btn"
      >
        传承接续（接手他身后的人）
      </button>

      <button
        id="endingNewBtn"
        type="button"
        class="settings-action-btn settings-danger-btn"
      >
        新开一局
      </button>

    </div>

  </div>

</div>


<!-- =========================================================
     确认弹窗
     ========================================================= -->

<div id="confirmModal" class="hidden">

  <div class="modal-card">

    <div class="modal-header">

      <h2 id="confirmTitle">确认</h2>

      <button
        id="confirmCloseBtn"
        class="modal-close-btn"
        type="button"
      >
        ✕
      </button>

    </div>

    <p
      id="confirmBody"
      class="confirm-body"
    ></p>

    <div class="confirm-btns">

      <button
        id="confirmCancelBtn"
        type="button"
        class="settings-action-btn"
      >
        取消
      </button>

      <button
        id="confirmOkBtn"
        type="button"
        class="settings-action-btn settings-danger-btn"
      >
        确定
      </button>

    </div>

  </div>

</div>


<!-- =========================================================
     改名弹窗
     ========================================================= -->

<div id="renameModal" class="hidden">

  <div class="modal-card">

    <div class="modal-header">

      <h2>改名存档</h2>

      <button
        id="renameCloseBtn"
        class="modal-close-btn"
        type="button"
      >
        ✕
      </button>

    </div>

    <input
      type="text"
      id="renameInput"
      class="rename-input"
      maxlength="20"
      placeholder="输入存档名称"
    >

    <div class="confirm-btns">

      <button
        id="renameCancelBtn"
        type="button"
        class="settings-action-btn"
      >
        取消
      </button>

      <button
        id="renameOkBtn"
        type="button"
        class="settings-action-btn"
      >
        确定
      </button>

    </div>

  </div>

</div>


<script src="config.js"></script>
<script src="engine.js"></script>
<script src="app.js"></script>

</body>
</html>
