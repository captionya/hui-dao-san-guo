<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>三国模拟人生</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<!-- ───── 主布局 ───── -->
<div id="app">
  <header id="header">
    <span id="gameTitle">三国模拟人生</span>
    <nav id="toolbar">
      <button id="themeBtn">暗色模式</button>
      <button id="newGameBtn">新开一局</button>
      <button id="settingsBtn">设置</button>
    </nav>
  </header>
  <main id="chatArea">
    <div id="messages"></div>
  </main>
  <footer id="inputArea">
    <textarea id="userInput" placeholder="输入你的行动或对话，留空发送可自动推进剧情……" rows="1"></textarea>
    <button id="sendBtn">发送</button>
  </footer>
</div>
<!-- ───── 设置面板 ───── -->
<div id="settingsOverlay" class="overlay hidden"></div>
<aside id="settingsPanel" class="hidden">
  <div class="panel-header">
    <h2>设置</h2>
    <button id="closeSettingsBtn" aria-label="关闭">✕</button>
  </div>
  <div class="panel-body">
    <section class="s-section">
      <h3>AI 模型</h3>
      <select id="modelSelect">
        <option value="deepseek-flash">Flash（推荐）</option>
        <option value="deepseek-v4-pro">Pro</option>
      </select>
    </section>
    <section class="s-section">
      <h3>存档管理</h3>
      <div id="slotList"></div>
    </section>
    <section class="s-section">
      <h3>导出当前存档</h3>
      <button id="exportBtn" class="btn-sec">复制到剪贴板</button>
    </section>
    <section class="s-section">
      <h3>导入存档</h3>
      <textarea id="importArea" placeholder="粘贴存档 JSON……" rows="3"></textarea>
      <button id="importBtn" class="btn-sec">导入到空槽位</button>
    </section>
    <section class="s-section">
      <h3>API Key</h3>
      <p id="apiKeyStatus"></p>
      <div class="btn-row">
        <button id="changeKeyBtn" class="btn-sec">更换 Key</button>
        <button id="clearKeyBtn"  class="btn-dng-out">清除 Key</button>
      </div>
    </section>
  </div>
</aside>
<!-- ───── 确认 Modal ───── -->
<div id="cfmOverlay" class="overlay modal-overlay hidden"></div>
<div id="cfmModal"   class="modal hidden">
  <div class="modal-inner">
    <h3 id="cfmTitle"></h3>
    <p  id="cfmBody"></p>
    <div class="modal-btns">
      <button id="cfmCancel" class="btn-sec">取消</button>
      <button id="cfmOk"     class="btn-dng">确认</button>
    </div>
  </div>
</div>
<!-- ───── 文本输入 Modal（改名）───── -->
<div id="inpOverlay" class="overlay modal-overlay hidden"></div>
<div id="inpModal"   class="modal hidden">
  <div class="modal-inner">
    <h3 id="inpTitle"></h3>
    <p  id="inpBody"></p>
    <input id="inpField" type="text" class="text-input" maxlength="20">
    <div class="modal-btns">
      <button id="inpCancel" class="btn-sec">取消</button>
      <button id="inpOk"     class="btn-pri">确认</button>
    </div>
  </div>
</div>
<!-- ───── API Key Modal ───── -->
<div id="keyOverlay" class="overlay modal-overlay hidden"></div>
<div id="keyModal"   class="modal hidden">
  <div class="modal-inner">
    <h3>输入 API Key</h3>
    <p>请输入你的 DeepSeek API Key：</p>
    <input id="keyField" type="password" class="text-input" placeholder="sk-…" autocomplete="off">
    <div class="modal-btns">
      <button id="keyCancel" class="btn-sec">取消</button>
      <button id="keyOk"     class="btn-pri">保存</button>
    </div>
  </div>
</div>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
