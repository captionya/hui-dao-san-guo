<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1c1a17">
<title>三国模拟人生</title>
<link rel="stylesheet" href="style.css">
</head>


<body>

<div id="app">

  <header>

    <h1>三国模拟人生</h1>

    <div id="toolbar">

      <button
        id="themeBtn"
        type="button"
      >
        日间模式
      </button>

      <button
        id="settingsBtn"
        type="button"
      >
        设置
      </button>

    </div>

  </header>

  <main id="chatWindow"></main>

  <div id="inputArea">

    <textarea
      id="userInput"
      rows="1"
      placeholder="输入你的行动或对话，留空直接发送可让剧情自动推进"
      autocomplete="off"
      spellcheck="false"
    ></textarea>

    <button
      id="sendBtn"
      type="button"
    >
      发送
    </button>

  </div>

</div>


<!-- =====================================================
     API Key 弹窗
     ===================================================== -->

<div id="keyModal" class="hidden">

  <div class="modal-card">

    <div class="modal-header">

      <h2 id="keyModalTitle">
        填写你的 DeepSeek API Key
      </h2>

      <button
        id="keyCloseBtn"
        class="modal-close-btn"
        type="button"
      >
        ✕
      </button>

    </div>

    <p>
      Key 只保存在你的浏览器里，不会上传到服务器。
    </p>

    <input
      type="password"
      id="keyInput"
      placeholder="sk-xxxxxxxxxxxxxxxx"
      autocomplete="off"
      spellcheck="false"
    >

    <p
      id="keyError"
      class="key-error"
    ></p>

    <button
      id="keySubmitBtn"
      type="button"
    >
      开始游戏
    </button>

    <button
      id="keyClearBtn"
      type="button"
      class="key-clear-btn"
    >
      清除 Key
    </button>

  </div>

</div>


<!-- =====================================================
     设置面板
     ===================================================== -->

<div id="settingsModal" class="hidden">

  <div class="modal-card">

    <div class="modal-header">

      <h2>设置</h2>

      <button
        id="settingsCloseBtn"
        class="modal-close-btn"
        type="button"
      >
        ✕
      </button>

    </div>

    <div class="settings-row">

      <span class="settings-label">
        AI 模型
      </span>

      <select
        id="modelSelect"
        title="选择 AI 模型"
      >
        <option value="deepseek-flash">
          Flash
        </option>

        <option value="deepseek-v4-pro">
          Pro
        </option>
      </select>

    </div>

    <button
      id="exportBtn"
      type="button"
      class="settings-action-btn"
    >
      导出存档
    </button>

    <button
      id="resetBtn"
      type="button"
      class="settings-action-btn settings-danger-btn"
    >
      重置游戏
    </button>

    <button
      id="changeKeyBtn"
      type="button"
      class="settings-action-btn"
    >
      更换 API Key
    </button>

  </div>

</div>


<script src="config.js"></script>
<script src="app.js"></script>

</body>
</html>
