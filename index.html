<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1c1a17">
<title>三国模拟人生</title>
<link rel="stylesheet" href="style.css">
</head>


<body>

<div id="app">

  <!-- =====================================================
       顶部
       ===================================================== -->

  <header>

    <h1>三国模拟人生</h1>

    <div id="toolbar">

      <select
        id="modelSelect"
        title="选择 AI 模型"
      >
        <option value="deepseek-flash">
          Flash
        </option>

        <option value="deepseek-v4-pro">
          Pro
        </option>
      </select>

      <button
        id="themeBtn"
        type="button"
      >
        日间模式
      </button>

      <button
        id="exportBtn"
        type="button"
      >
        导出存档
      </button>

      <button
        id="resetBtn"
        type="button"
      >
        重置
      </button>

    </div>

  </header>


  <!-- =====================================================
       剧情区域
       ===================================================== -->

  <main id="chatWindow"></main>


  <!-- =====================================================
       输入区域
       ===================================================== -->

  <div id="inputArea">

    <textarea
      id="userInput"
      rows="1"
      placeholder="输入你的行动或对话，留空直接发送可让剧情自动推进"
      autocomplete="off"
      spellcheck="false"
    ></textarea>

    <button
      id="sendBtn"
      type="button"
    >
      发送
    </button>

  </div>

</div>


<script src="config.js"></script>
<script src="app.js"></script>

</body>
</html>
