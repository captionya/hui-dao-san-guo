<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>三国模拟人生</title>

<style>
  * {
    box-sizing: border-box;
  }

  :root {
    --bg: #1c1a17;
    --text: #eee;
    --header-bg: #2b2620;
    --border: #443c33;
    --accent: #d9b26b;
    --user-color: #9fd39f;
    --input-bg: #1c1a17;
    --btn-bg: #443c33;
    --btn-text: #eee;
    --tag-color: #d9b26b;
    --muted: #999;
    --paper-shadow: none;
  }

  /* =========================
     日间模式：羊皮纸
     ========================= */

  body.theme-day {
    --bg: #d8c28e;
    --text: #49351f;
    --header-bg: #c9ad72;
    --border: #9d7d48;
    --accent: #70461f;
    --user-color: #4d6840;
    --input-bg: #ead8a9;
    --btn-bg: #b3935b;
    --btn-text: #392612;
    --tag-color: #70461f;
    --muted: #806b4c;
    --paper-shadow: inset 0 0 80px rgba(67, 42, 16, 0.18);
  }

  html,
  body {
    width: 100%;
    height: 100%;
    margin: 0;
  }

  body {
    font-family:
      -apple-system,
      BlinkMacSystemFont,
      "PingFang SC",
      "Microsoft YaHei",
      sans-serif;

    background: var(--bg);
    color: var(--text);
    overflow: hidden;
  }

  #app {
    display: flex;
    flex-direction: column;
    width: 100%;
    height: 100vh;
    background: var(--bg);
  }

  /* =========================
     顶部
     ========================= */

  header {
    flex-shrink: 0;

    display: flex;
    justify-content: space-between;
    align-items: center;

    min-height: 52px;
    padding: 8px 12px;

    background: var(--header-bg);
    border-bottom: 1px solid var(--border);

    position: relative;
    z-index: 10;
  }

  header h1 {
    margin: 0;
    font-size: 18px;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: 1px;
    white-space: nowrap;
  }

  #toolbar {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  #toolbar button,
  #modelSelect {
    height: 32px;
    padding: 0 9px;

    font-size: 12px;

    background: var(--btn-bg);
    color: var(--btn-text);

    border: 1px solid var(--border);
    border-radius: 5px;

    outline: none;
  }

  #toolbar button:active {
    transform: translateY(1px);
  }

  #toolbar button:disabled,
  #modelSelect:disabled {
    opacity: 0.5;
  }

  #modelSelect {
    max-width: 90px;
  }

  /* =========================
     聊天区域
     ========================= */

  #chatWindow {
    flex: 1;
    min-height: 0;

    overflow-y: auto;
    overflow-x: hidden;

    padding: 20px 16px 30px;

    background: var(--bg);

    /*
      关键：
      不在 JS 中持续修改 scrollTop。
      AI 生成过程中，用户的阅读位置由用户自己控制。
    */

    scroll-behavior: auto;

    -webkit-overflow-scrolling: touch;

    position: relative;
  }

  /* 日间模式的羊皮纸质感 */
  body.theme-day #chatWindow {
    background:
      radial-gradient(
        ellipse at 18% 12%,
        rgba(255, 255, 255, 0.20) 0%,
        rgba(255, 255, 255, 0) 34%
      ),
      radial-gradient(
        ellipse at 82% 88%,
        rgba(82, 51, 20, 0.10) 0%,
        rgba(82, 51, 20, 0) 36%
      ),
      radial-gradient(
        ellipse at 50% 50%,
        rgba(255, 244, 205, 0.08) 0%,
        rgba(255, 244, 205, 0) 65%
      ),
      repeating-linear-gradient(
        0deg,
        rgba(92, 60, 24, 0.025) 0px,
        rgba(92, 60, 24, 0.025) 1px,
        transparent 1px,
        transparent 4px
      ),
      #d8c28e;

    box-shadow: var(--paper-shadow);
  }

  /* 羊皮纸边缘的暗化效果 */
  body.theme-day #chatWindow::after {
    content: "";
    position: fixed;

    left: 0;
    right: 0;
    top: 52px;
    bottom: 72px;

    pointer-events: none;

    box-shadow:
      inset 0 0 70px rgba(73, 45, 17, 0.12),
      inset 0 0 18px rgba(73, 45, 17, 0.07);

    z-index: 1;
  }

  /* =========================
     消息
     ========================= */

  .msg {
    position: relative;
    z-index: 2;

    margin: 0 auto 22px;
    max-width: 850px;

    line-height: 1.9;
    font-size: 15px;

    white-space: pre-wrap;
    overflow-wrap: anywhere;
    word-break: break-word;
  }

  .msg.user {
    color: var(--user-color);

    padding-left: 10px;
    border-left: 2px solid var(--user-color);
  }

  .msg.assistant {
    color: var(--text);
  }

  .msg.assistant::first-letter {
    /* 保留自然文本，不做过度装饰 */
  }

  .thinking {
    color: var(--muted);
    font-style: italic;
  }

  /* =========================
     日间模式中的文字细节
     ========================= */

  body.theme-day .msg.assistant {
    text-shadow: 0 0 0.2px rgba(50, 30, 10, 0.2);
  }

  body.theme-day .msg.user {
    background: rgba(255, 244, 205, 0.18);
    padding: 7px 10px;
    border-left: 3px solid var(--user-color);
  }

  /* =========================
     底部输入区
     ========================= */

  #inputArea {
    flex-shrink: 0;

    display: flex;
    align-items: flex-end;

    padding: 10px;

    background: var(--header-bg);
    border-top: 1px solid var(--border);

    position: relative;
    z-index: 10;
  }

  #userInput {
    flex: 1;

    min-height: 44px;
    max-height: 130px;

    padding: 10px 12px;

    border: 1px solid var(--border);
    border-radius: 7px;

    background: var(--input-bg);
    color: var(--text);

    resize: none;

    font-family: inherit;
    font-size: 15px;
    line-height: 1.5;

    outline: none;
  }

  #userInput::placeholder {
    color: var(--muted);
  }

  #userInput:focus {
    border-color: var(--accent);
  }

  #sendBtn {
    flex-shrink: 0;

    min-width: 64px;
    height: 44px;

    margin-left: 8px;
    padding: 0 16px;

    background: var(--accent);
    color: var(--bg);

    border: none;
    border-radius: 7px;

    font-size: 14px;
    font-weight: bold;
  }

  #sendBtn:active {
    transform: translateY(1px);
  }

  #sendBtn:disabled {
    opacity: 0.5;
  }

  /* =========================
     日间模式按钮细节
     ========================= */

  body.theme-day #toolbar button,
  body.theme-day #modelSelect {
    border-color: #947344;

    background:
      linear-gradient(
        rgba(255, 239, 190, 0.12),
        rgba(104, 70, 27, 0.08)
      ),
      var(--btn-bg);

    box-shadow:
      inset 0 1px rgba(255, 244, 207, 0.25),
      0 1px 1px rgba(65, 40, 14, 0.12);
  }

  body.theme-day #inputArea {
    box-shadow: inset 0 8px 18px rgba(79, 49, 17, 0.05);
  }

  body.theme-day #userInput {
    box-shadow:
      inset 0 2px 8px rgba(82, 52, 18, 0.08),
      0 1px 0 rgba(255, 245, 214, 0.25);
  }

  /* =========================
     手机屏幕适配
     ========================= */

  @media (max-width: 600px) {
    header {
      padding: 7px 8px;
    }

    header h1 {
      font-size: 16px;
      letter-spacing: 0;
    }

    #toolbar {
      gap: 4px;
    }

    #toolbar button,
    #modelSelect {
      height: 30px;
      padding: 0 7px;
      font-size: 11px;
    }

    #modelSelect {
      max-width: 72px;
    }

    #chatWindow {
      padding: 18px 13px 26px;
    }

    .msg {
      font-size: 15px;
      line-height: 1.85;
      margin-bottom: 20px;
    }

    #inputArea {
      padding: 8px;
    }

    #userInput {
      font-size: 15px;
      min-height: 44px;
    }

    #sendBtn {
      min-width: 58px;
      padding: 0 12px;
    }
  }
</style>
</head>

<body>

<div id="app">

  <header>
    <h1>三国模拟人生</h1>

    <div id="toolbar">

      <select id="modelSelect" title="选择 AI 模型">
        <option value="deepseek-flash">Flash</option>
        <option value="deepseek-v4-pro">Pro</option>
      </select>

      <button id="themeBtn">日间模式</button>

      <button id="exportBtn">导出存档</button>

      <button id="resetBtn">重置</button>

    </div>
  </header>


  <div id="chatWindow"></div>


  <div id="inputArea">

    <textarea
      id="userInput"
      placeholder="输入你的行动或对话，留空直接发送可让剧情自动推进"
    ></textarea>

    <button id="sendBtn">发送</button>

  </div>

</div>


<script>

/* =========================================================
   三国模拟人生 V1.2
   重点：
   1. 重置后真正开始新剧情
   2. AI生成时不持续自动滚动
   3. 新回复开始时只定位一次
   4. 日间模式 = 羊皮纸视觉
   ========================================================= */


/* =========================================================
   系统提示词
   ========================================================= */

const SYSTEM_PROMPT = `你是一个三国题材沉浸式文字模拟游戏的主持人(GM)。

规则:

1. 视角人物由玩家指定或随机生成，可以是刘备、诸葛亮这类真实历史人物，也可以是普通难民、士兵等虚构小人物。

2. 历史可被玩家的选择改写，存在“蝴蝶效应”：玩家在关键事件上的决策会持续影响后续剧情、势力格局与人物关系，不会被剧情自动纠正回“正史”。

3. 叙事风格不设特定文风限制，自然流畅表达即可。

4. 保持高自由度：玩家可以随时脱离主线，与在场的任意NPC展开不限轮次的深入对话或思想探讨，包括哲学、政治理念、人生选择、人际关系等，不强制每一轮都推进主线剧情。

5. 输入以自由文本为主。在面临重大抉择的节点，可以在叙述末尾额外提供2-4个选项供参考，但玩家仍然可以完全不理会这些选项，自由输入自己的行动。

6. 政务系统需覆盖屯田、粮草、军粮储备、后勤、兵器、装备等具体子项，相关数值变化要体现在剧情和人物反馈中，而不是只显示抽象数字。

7. NPC必须拥有相对稳定的身份、性格、立场、利益和记忆。不同NPC之间应该存在观点差异，不要让所有人都顺着玩家说话。

8. NPC应该根据玩家过去的行为形成合理的态度变化。玩家帮助、欺骗、得罪、救援、威胁或者长期相处，都应该影响后续关系。

9. 不要把玩家强行设定成“天选之子”。普通人物也可以进行游戏，也可能失败、受挫、被拒绝或者错过机会。

10. 战争、政治、经济和人物关系都应该有因果关系。玩家的行动可能产生短期和长期后果。

11. 玩家可以尝试非常规行动。只要符合世界逻辑，就应该认真判断其可能产生的结果，而不是简单回答“不可以”。

12. 尽量避免使用星号、下划线等Markdown符号来标记文字。直接用自然语言体现语气、身份和状态。

13. 游戏开始时，不要直接替玩家决定身份。应该先引导玩家选择或者随机生成一个视角人物，然后正式开始游戏。

现在，请开始一场新的三国人生模拟。`;


/* =========================================================
   全局变量
   ========================================================= */

let messages = [];

let chatWindow = null;
let userInput = null;

let isGenerating = false;

let currentModel = "deepseek-flash";


/* =========================================================
   存档结构
   ========================================================= */

function createNewSave() {

  return {
    version: 1,

    createdAt: new Date().toISOString(),

    updatedAt: new Date().toISOString(),

    gameState: {},

    messages: [
      {
        role: "system",
        content: SYSTEM_PROMPT
      }
    ]
  };

}


/* =========================================================
   保存
   ========================================================= */

function saveState() {

  const save = {
    version: 1,

    createdAt:
      getExistingCreatedAt(),

    updatedAt:
      new Date().toISOString(),

    gameState: {},

    messages: messages
  };

  localStorage.setItem(
    "sanguo_save",
    JSON.stringify(save)
  );

}


/* =========================================================
   获取原来的创建时间
   ========================================================= */

function getExistingCreatedAt() {

  const raw =
    localStorage.getItem("sanguo_save");

  if (!raw) {
    return new Date().toISOString();
  }

  try {

    const data = JSON.parse(raw);

    if (
      data &&
      !Array.isArray(data) &&
      data.createdAt
    ) {
      return data.createdAt;
    }

  } catch (e) {}

  return new Date().toISOString();

}


/* =========================================================
   加载存档
   ========================================================= */

function loadState() {

  const saved =
    localStorage.getItem("sanguo_save");

  if (!saved) {

    const newSave =
      createNewSave();

    messages =
      newSave.messages;

    return;

  }


  try {

    const data =
      JSON.parse(saved);


    /*
      兼容 V1.0：
      以前存档直接是 messages 数组
    */

    if (Array.isArray(data)) {

      messages = data;

    }

    else if (
      data &&
      Array.isArray(data.messages)
    ) {

      messages = data.messages;

    }

    else {

      messages =
        createNewSave().messages;

    }


    /*
      如果系统消息不存在，
      自动补回来。
    */

    const hasSystem =
      messages.some(
        m => m.role === "system"
      );

    if (!hasSystem) {

      messages.unshift({
        role: "system",
        content: SYSTEM_PROMPT
      });

    }

  } catch (e) {

    messages =
      createNewSave().messages;

  }

}


/* =========================================================
   判断当前是不是“空的新游戏”
   ========================================================= */

function isEmptyGame() {

  return (
    messages.filter(
      m => m.role !== "system"
    ).length === 0
  );

}


/* =========================================================
   主题
   ========================================================= */

function loadTheme() {

  const theme =
    localStorage.getItem("sanguo_theme");


  /*
    兼容之前的 scroll
  */

  if (
    theme === "day" ||
    theme === "scroll"
  ) {

    document.body.classList.add(
      "theme-day"
    );

  }

  updateThemeButton();

}


/* =========================================================
   更新主题按钮文字
   ========================================================= */

function updateThemeButton() {

  const btn =
    document.getElementById("themeBtn");

  if (!btn) return;


  if (
    document.body.classList.contains(
      "theme-day"
    )
  ) {

    btn.textContent = "暗色模式";

  }

  else {

    btn.textContent = "日间模式";

  }

}


/* =========================================================
   切换主题
   ========================================================= */

function toggleTheme() {

  const isDay =
    document.body.classList.toggle(
      "theme-day"
    );


  localStorage.setItem(
    "sanguo_theme",
    isDay ? "day" : "dark"
  );


  updateThemeButton();

}


/* =========================================================
   HTML安全处理
   ========================================================= */

function escapeHTML(str) {

  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");

}


/* =========================================================
   创建消息元素
   ========================================================= */

function createMessageDiv(m) {

  const div =
    document.createElement("div");

  div.className =
    "msg " + m.role;


  if (m.role === "user") {

    div.textContent =
      "你: " + m.content;

  }

  else {

    div.textContent =
      m.content;

  }


  return div;

}


/* =========================================================
   添加消息
   ========================================================= */

function appendMessageDiv(m) {

  const div =
    createMessageDiv(m);

  chatWindow.appendChild(div);

  return div;

}


/* =========================================================
   渲染全部消息
   ========================================================= */

function renderMessages() {

  /*
    这里保留用户当前滚动位置。

    这样如果以后因为某些操作需要重新渲染，
    也不会突然把用户拉到底部。
  */

  const oldScrollTop =
    chatWindow
      ? chatWindow.scrollTop
      : 0;


  chatWindow.innerHTML = "";


  messages.forEach(m => {

    if (m.role === "system") {
      return;
    }

    appendMessageDiv(m);

  });


  /*
    恢复之前的位置。
    注意：不是 scrollToBottom。
  */

  chatWindow.scrollTop =
    oldScrollTop;

}


/* =========================================================
   把最新的AI回复放到阅读位置
   ========================================================= */

/*
   非常重要：

   这里只在“AI回复刚开始生成”的时候执行一次。

   后面AI不断增加文字时：
   不再调用scrollIntoView
   不再修改scrollTop
   不再滚到底部

   所以用户可以安心阅读。
*/

function placeAssistantForReading(assistantDiv) {

  requestAnimationFrame(() => {

    if (!assistantDiv) return;


    /*
      assistantDiv.offsetTop
      = 它距离聊天区域顶部的位置
    */

    const targetTop =
      assistantDiv.offsetTop - 10;


    /*
      只定位一次。
    */

    chatWindow.scrollTop =
      Math.max(0, targetTop);

  });

}


/* =========================================================
   设置生成状态
   ========================================================= */

function setGeneratingState(value) {

  isGenerating = value;


  const sendBtn =
    document.getElementById("sendBtn");

  const resetBtn =
    document.getElementById("resetBtn");

  const themeBtn =
    document.getElementById("themeBtn");

  const exportBtn =
    document.getElementById("exportBtn");

  const modelSelect =
    document.getElementById("modelSelect");


  if (sendBtn) {
    sendBtn.disabled = value;
  }

  if (resetBtn) {
    resetBtn.disabled = value;
  }

  if (themeBtn) {
    themeBtn.disabled = value;
  }

  if (exportBtn) {
    exportBtn.disabled = value;
  }

  if (modelSelect) {
    modelSelect.disabled = value;
  }

}


/* =========================================================
   读取模型
   ========================================================= */

function loadModel() {

  const saved =
    localStorage.getItem(
      "sanguo_model"
    );


  if (
    saved === "deepseek-flash" ||
    saved === "deepseek-v4-pro"
  ) {

    currentModel = saved;

  }


  const select =
    document.getElementById(
      "modelSelect"
    );


  if (select) {
    select.value =
      currentModel;
  }

}


/* =========================================================
   保存模型
   ========================================================= */

function changeModel() {

  const select =
    document.getElementById(
      "modelSelect"
    );


  if (!select) return;


  currentModel =
    select.value;


  localStorage.setItem(
    "sanguo_model",
    currentModel
  );

}


/* =========================================================
   核心：请求AI并流式显示
   ========================================================= */

async function requestAssistant() {

  if (isGenerating) {
    return null;
  }


  setGeneratingState(true);


  /*
    创建AI消息占位元素
  */

  const assistantDiv =
    document.createElement("div");

  assistantDiv.className =
    "msg assistant";


  assistantDiv.innerHTML =
    '<span class="thinking">……思考中……</span>';


  chatWindow.appendChild(
    assistantDiv
  );


  /*
    关键操作：

    AI刚开始生成的时候，
    只把“这条新回复的开头”
    放到视野里。

    后续生成绝对不再自动滚动。
  */

  placeAssistantForReading(
    assistantDiv
  );


  let fullText = "";


  try {

    const res =
      await fetch("/api/chat", {

        method: "POST",

        headers: {
          "Content-Type":
            "application/json"
        },

        body: JSON.stringify({

          messages: messages,

          model: currentModel

        })

      });


    if (
      !res.ok ||
      !res.body
    ) {

      let errInfo = "";


      try {

        errInfo =
          JSON.stringify(
            await res.json()
          );

      } catch (e) {}


      const errorText =
        "出错了：" +
        (
          errInfo ||
          ("HTTP " + res.status)
        );


      assistantDiv.textContent =
        errorText;


      return null;

    }


    const reader =
      res.body.getReader();


    const decoder =
      new TextDecoder("utf-8");


    let buffer = "";


    while (true) {

      const result =
        await reader.read();


      const value =
        result.value;

      const done =
        result.done;


      if (done) {
        break;
      }


      buffer +=
        decoder.decode(
          value,
          {
            stream: true
          }
        );


      const lines =
        buffer.split("\n");


      buffer =
        lines.pop();


      for (
        const line of lines
      ) {

        const trimmed =
          line.trim();


        if (
          !trimmed.startsWith(
            "data:"
          )
        ) {
          continue;
        }


        const payload =
          trimmed
            .slice(5)
            .trim();


        if (
          payload === "[DONE]" ||
          payload === ""
        ) {
          continue;
        }


        try {

          const json =
            JSON.parse(
              payload
            );


          const delta =
            json.choices &&
            json.choices[0] &&
            json.choices[0].delta;


          const piece =
            delta &&
            delta.content;


          if (piece) {

            fullText +=
              piece;


            /*
              关键：

              这里只更新文字。

              没有：
              scrollIntoView()
              scrollTop =
              scrollTo()

              因此不会自动下滑。
            */

            assistantDiv.textContent =
              fullText;

          }

        } catch (e) {

          /*
            某些SSE分片可能暂时
            不是完整JSON，直接跳过。
          */

        }

      }

    }


    if (!fullText) {

      fullText =
        "（未获取到有效回复，请稍后重试。）";


      assistantDiv.textContent =
        fullText;

    }


    /*
      把完整AI回复加入正式存档
    */

    messages.push({

      role: "assistant",

      content: fullText

    });


    saveState();


    return fullText;


  } catch (err) {

    const errorText =
      "网络错误：" +
      err.message;


    assistantDiv.textContent =
      errorText;


    return null;


  } finally {

    setGeneratingState(false);

  }

}


/* =========================================================
   正常发送玩家消息
   ========================================================= */

async function sendMessage(text) {

  if (isGenerating) {
    return;
  }


  const content =
    text.trim()
      ? text.trim()
      : "(继续推进剧情)";


  const userMsg = {

    role: "user",

    content: content

  };


  /*
    先把玩家输入加入消息记录
  */

  messages.push(
    userMsg
  );


  appendMessageDiv(
    userMsg
  );


  saveState();


  /*
    请求AI
  */

  await requestAssistant();

}


/* =========================================================
   真正开始一局新游戏
   ========================================================= */

async function startNewGame() {

  if (isGenerating) {
    return;
  }


  /*
    新游戏只保留system prompt。

    不添加假的“玩家消息”。
  */

  messages = [
    {
      role: "system",
      content: SYSTEM_PROMPT
    }
  ];


  saveState();


  renderMessages();


  /*
    直接让AI开始新的游戏。

    AI会按照system prompt：
    引导玩家选择/生成视角人物。
  */

  await requestAssistant();

}


/* =========================================================
   真正的重置
   ========================================================= */

async function resetGame() {

  if (isGenerating) {
    return;
  }


  const confirmed =
    confirm(
      "确定要开始全新的三国人生吗？\n\n当前剧情、人物关系和对话记录都会被清空。"
    );


  if (!confirmed) {
    return;
  }


  /*
    彻底删除旧存档
  */

  localStorage.removeItem(
    "sanguo_save"
  );


  /*
    重新开始
  */

  await startNewGame();

}


/* =========================================================
   导出存档
   ========================================================= */

function exportSave() {

  const save = {

    version: 1,

    exportedAt:
      new Date().toISOString(),

    model:
      currentModel,

    messages:
      messages

  };


  const text =
    JSON.stringify(
      save,
      null,
      2
    );


  if (
    navigator.clipboard
  ) {

    navigator.clipboard
      .writeText(text)
      .then(() => {

        alert(
          "存档已复制到剪贴板"
        );

      })
      .catch(() => {

        prompt(
          "请手动复制以下存档内容：",
          text
        );

      });

  }

  else {

    prompt(
      "请手动复制以下存档内容：",
      text
    );

  }

}


/* =========================================================
   输入框自动增高
   ========================================================= */

function autoResizeTextarea() {

  userInput.style.height =
    "auto";


  const height =
    Math.min(
      userInput.scrollHeight,
      130
    );


  userInput.style.height =
    height + "px";

}


/* =========================================================
   页面启动
   ========================================================= */

window.onload = async function() {

  chatWindow =
    document.getElementById(
      "chatWindow"
    );


  userInput =
    document.getElementById(
      "userInput"
    );


  /*
    加载主题
  */

  loadTheme();


  /*
    加载模型
  */

  loadModel();


  /*
    加载存档
  */

  loadState();


  /*
    显示历史剧情
  */

  renderMessages();


  /* =========================
     发送按钮
     ========================= */

  document.getElementById(
    "sendBtn"
  ).onclick = async () => {

    const text =
      userInput.value;


    userInput.value = "";

    autoResizeTextarea();


    await sendMessage(text);

  };


  /* =========================
     Enter发送
     Shift + Enter换行
     ========================= */

  userInput.addEventListener(
    "keydown",
    async (event) => {

      if (
        event.key === "Enter" &&
        !event.shiftKey
      ) {

        event.preventDefault();


        if (isGenerating) {
          return;
        }


        const text =
          userInput.value;


        userInput.value = "";

        autoResizeTextarea();


        await sendMessage(text);

      }

    }
  );


  /*
    输入时自动调整高度
  */

  userInput.addEventListener(
    "input",
    autoResizeTextarea
  );


  /* =========================
     日间模式
     ========================= */

  document.getElementById(
    "themeBtn"
  ).onclick =
    toggleTheme;


  /* =========================
     模型
     ========================= */

  document.getElementById(
    "modelSelect"
  ).onchange =
    changeModel;


  /* =========================
     重置
     ========================= */

  document.getElementById(
    "resetBtn"
  ).onclick =
    resetGame;


  /* =========================
     导出
     ========================= */

  document.getElementById(
    "exportBtn"
  ).onclick =
    exportSave;


  /* =====================================================
     第一次打开游戏时自动开始

     如果当前只有system prompt，
     说明还没有真正开始过剧情。
     ===================================================== */

  if (isEmptyGame()) {

    await startNewGame();

  }

};

</script>
